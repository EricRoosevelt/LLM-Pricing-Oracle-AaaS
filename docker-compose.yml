services:
  postgres:
    image: postgres:15-alpine
    container_name: oracle_postgres
    restart: always
    environment:
      POSTGRES_USER: oracle_user
      POSTGRES_PASSWORD: oracle_password
      POSTGRES_DB: oracle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: oracle_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  decision-api:
    build: .
    container_name: oracle_decision_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://oracle_user:oracle_password@postgres:5432/oracle_db
      - REDIS_URL=redis://redis:6379/0
      - CATALOG_PATH=/app/models_config.json
      - BOOTSTRAP_AGENT_CREDENTIALS=${BOOTSTRAP_AGENT_CREDENTIALS}
      - PROBE_PROXY=${PROBE_PROXY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: always

  probe-worker:
    build: .
    container_name: oracle_probe_worker
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://oracle_user:oracle_password@postgres:5432/oracle_db
      - CATALOG_PATH=/app/models_config.json
      - PROBE_PROXY=${PROBE_PROXY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    command: ["python", "-m", "app.workers.probe_worker"]
    restart: always

  event-consumer:
    build: .
    container_name: oracle_event_consumer
    depends_on:
      - postgres
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://oracle_user:oracle_password@postgres:5432/oracle_db
      - CATALOG_PATH=/app/models_config.json
    command: ["sh", "-c", "alembic upgrade head && python -m app.workers.event_consumer"]
    restart: always

volumes:
  postgres_data:
  redis_data:
